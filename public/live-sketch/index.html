<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live sketch</title>
<meta name="description" content="Type a word or drop in a photo and watch a coral-like pattern grow out of it. Turn on the mic and it moves with the music.">
<meta name="theme-color" content="#0f0b0c">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%230f0b0c'/%3E%3Ccircle cx='8' cy='8' r='4' fill='%23fa735c'/%3E%3C/svg%3E">
<style>
  /* --tint follows the colour the visitor picks (set from sketch.js), so the focus ring, caret and selection match the piece. */
  :root { --ground: #0f0b0c; --ink: #ffeedd; --tint: #fa735c; --glass: rgb(15 11 12 / .72); --edge: rgb(255 238 221 / .32); }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; font-optical-sizing: auto; accent-color: var(--tint); }
  ::selection { background: var(--tint); color: var(--ground); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  form { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%);
         display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; width: min(640px, calc(100% - 32px)); }
  button, input[type=color] {
    box-sizing: border-box; height: 44px; margin: 0; font: inherit; color: inherit; background: var(--glass);
    border: 1px solid var(--edge); border-radius: 999px;
    /* the blur keeps the controls readable once the pattern grows underneath them */
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: background-color .15s ease-out, border-color .15s ease-out, color .15s ease-out;
  }
  /* You type straight onto the picture: the real text box is invisible, and a blinking caret after the word stands in for it.
     16px keeps phones from zooming in when it takes focus. */
  #t { position: fixed; left: 50%; top: 50%; width: 1px; height: 1px; margin: 0; padding: 0; border: 0; opacity: 0; font-size: 16px; pointer-events: none; }
  #caret { position: fixed; display: none; border-radius: 999px; background: color-mix(in srgb, var(--tint) 20%, white); pointer-events: none;
           animation: blink 1.1s steps(1) infinite; }
  #caret.on:not([hidden]) { display: block; } /* shown while typing, and briefly on arrival as a hint (sketch.js) */
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #caret { animation: none; } }
  button:hover, input[type=color]:hover { border-color: rgb(255 238 221 / .6); }
  button { padding: 0 18px; cursor: pointer; white-space: nowrap; }
  button:active { background: rgb(255 238 221 / .16); }
  button:disabled { opacity: .55; cursor: default; }
  button[aria-pressed=true] { background: var(--ink); border-color: var(--ink); color: var(--ground); }
  input[type=color] { flex: none; width: 44px; padding: 5px; cursor: pointer; }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type=color]::-webkit-color-swatch { border: 0; border-radius: 50%; }
  input[type=color]::-moz-color-swatch { border: 0; border-radius: 50%; }
  :focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }

  #note { position: fixed; top: max(16px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); box-sizing: border-box;
          width: max-content; max-width: calc(100% - 32px); margin: 0; padding: 7px 14px; border-radius: 18px;
          font-size: 13px; text-align: center; text-wrap: balance; background: var(--glass); pointer-events: none; user-select: none; -webkit-user-select: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="A coral-like pattern growing out of the word or photo you gave it"></canvas>
<p id="note" role="status">Just type, or add a photo. Drag to stir. Photos never leave your device.</p>
<div id="caret" aria-hidden="true"></div>
<form id="f">
  <label class="sr" for="t">Word to grow from</label>
  <input id="t" type="text" maxlength="40" value="live sketch" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" autofocus>
  <button type="button" id="photo">Photo</button>
  <input id="file" type="file" accept="image/*" hidden>
  <button type="button" id="mic" aria-pressed="false">Listen</button>
  <label class="sr" for="color">Color</label>
  <input id="color" type="color" value="#fa735c" title="Color">
</form>
<script>
  // Served at a clean address with no trailing slash (/live-sketch), "sketch.js" would resolve one folder too high.
  // Putting the slash back first keeps the relative path right on any host.
  if (!/\/$|\.html$/.test(location.pathname)) history.replaceState(null, "", location.pathname + "/" + location.search + location.hash);
</script>
<script src="sketch.js"></script>
</body>
</html>
